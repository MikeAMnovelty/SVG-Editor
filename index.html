<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AMNovelty Tumbler Designer</title>
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./svgedit.css">
</head>
<body>
  <header class="topbar">
    <h1>AMNovelty Tumbler Designer</h1>
    <button id="exportBtn">Export SVG</button>
  </header>

  <main class="layout">
    <aside class="palette">
      <h2>Artwork</h2>
      <div id="assetList"></div>
    </aside>

    <section class="workspace">
      <svg id="canvas"
         xmlns="http://www.w3.org/2000/svg"
         width="100%"
         height="600"
         style="background:#fff; border-radius:12px; display:block;">
        <!-- designs drop here -->
      </svg>
    </section>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
